<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════
  index.html · Italia ⇄ Colombia — hora en vivo con su cielo real
  ──────────────────────────────────────────────────────────────────────
  Qué es:   Página pequeña que muestra la hora de Roma (Italia) y de
            Cartagena (Colombia). Cada país tiene su "ventana de cielo":
            sol de día; luna y estrellas de noche; amanecer y atardecer
            calculados con astronomía real; y en el centro, la diferencia
            horaria entre los dos países.
  Archivos: css/styles.css → diseño, capas del cielo y animaciones.
            js/script.js   → hora de cada zona, posición del sol, fase de
                             la luna, colores del cielo, estrellas y el
                             "viaje en el tiempo" (arrastrar el cielo).
  Cómo funciona: este HTML trae el esqueleto fijo (tarjetas, siluetas de
            cada ciudad y textos). Todo lo que cambia con la hora lo pinta
            script.js escribiendo variables CSS (--sky-top, --c-land, etc.)
            sobre cada tarjeta. Si el JS no cargara, se ve un cielo de día.
  ══════════════════════════════════════════════════════════════════════
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Italia · Colombia — Hora en vivo</title>
  <meta name="description" content="La hora en vivo de Roma, Italia y Cartagena, Colombia, con su cielo real de día y de noche y la diferencia horaria entre los dos países.">
  <meta name="theme-color" content="#0b0c11">
  <meta name="color-scheme" content="dark">

  <!-- Ícono de la pestaña (SVG en línea: sol y luna). Va embebido para no
       depender de otro archivo y evitar el error 404 de /favicon.ico. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e1222'/%3E%3Ccircle cx='25' cy='36' r='13' fill='%23ffc45c'/%3E%3Ccircle cx='43' cy='22' r='10' fill='%23e9ecf6'/%3E%3Ccircle cx='48' cy='18' r='9' fill='%230e1222'/%3E%3C/svg%3E">

  <!-- Tipografías (Google Fonts) cargadas sin bloquear el render:
       Fraunces → nombres de los países y número de la diferencia.
       Outfit   → reloj, ciudad, fecha y textos pequeños.
       Si no hay internet, el CSS cae en fuentes del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&amp;family=Outfit:wght@200..600&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&amp;family=Outfit:wght@200..600&amp;display=swap"></noscript>

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════════
       ESCENARIO: las dos ventanas de cielo y el puente del centro.
       En computador van lado a lado; en celular se apilan (ver CSS).
       ════════════════════════════════════════════════════════════════ -->
  <main class="stage" data-role="stage">
    <h1 class="sr-only">Hora en vivo y diferencia horaria entre Italia y Colombia</h1>

    <!-- ┌──────────────────────────────────────────────────────────────┐
         │ TARJETA · ITALIA (Roma)                                      │
         │ data-place enlaza esta tarjeta con su configuración en       │
         │ script.js (zona horaria Europe/Rome y coordenadas del Coliseo)│
         │ tabindex=0 → con el teclado se puede "viajar en el tiempo"   │
         │ usando las flechas ← → (Esc vuelve a la hora real).          │
         └──────────────────────────────────────────────────────────────┘ -->
    <article class="place place--it" data-place="italia" tabindex="0" aria-labelledby="it-name" aria-describedby="it-sr">

      <!-- CIELO: capas apiladas de atrás hacia adelante.
           1) degradado + resplandor del horizonte (fondo de .sky)
           2) canvas de estrellas y estrellas fugaces
           3) luna  4) sol  5) nubes
           6) paisaje lejano (SVG)  7) paisaje cercano (SVG)
           8) velo oscuro arriba/abajo para que los textos siempre se lean -->
      <div class="sky" aria-hidden="true">
        <canvas class="sky__stars" data-role="stars"></canvas>

        <!-- LUNA: la forma iluminada (fase real del día) la dibuja script.js
             cambiando el atributo "d" del recorte #moon-clip-it. -->
        <div class="moon" data-role="moon">
          <span class="moon__halo"></span>
          <svg class="moon__svg" viewBox="0 0 100 100">
            <defs>
              <radialGradient id="moon-lit-it" cx="42%" cy="38%" r="70%">
                <stop offset="0" stop-color="#fffdf4"/>
                <stop offset=".65" stop-color="#ebe7da"/>
                <stop offset="1" stop-color="#c9c4b4"/>
              </radialGradient>
              <clipPath id="moon-clip-it"><path data-role="moon-phase" d="M50 2a48 48 0 1 1 0 96a48 48 0 1 1 0-96z"/></clipPath>
            </defs>
            <circle class="moon__dark" cx="50" cy="50" r="48"/>
            <g clip-path="url(#moon-clip-it)">
              <circle cx="50" cy="50" r="48" fill="url(#moon-lit-it)"/>
              <g class="moon__maria">
                <ellipse cx="35" cy="33" rx="13" ry="10"/>
                <ellipse cx="57" cy="32" rx="8" ry="7"/>
                <ellipse cx="63" cy="47" rx="9" ry="7"/>
                <ellipse cx="74" cy="58" rx="5" ry="7"/>
                <ellipse cx="80" cy="36" rx="5" ry="4"/>
                <ellipse cx="24" cy="54" rx="11" ry="17"/>
                <ellipse cx="45" cy="66" rx="8" ry="6"/>
              </g>
              <circle class="moon__crater" cx="48" cy="83" r="2.6"/>
            </g>
          </svg>
        </div>

        <!-- SOL: halo + rayos suaves + disco. Su posición y color (amarillo
             de día, naranja al salir/ponerse) los controla script.js. -->
        <div class="sun" data-role="sun">
          <span class="sun__halo"></span>
          <span class="sun__rays"></span>
          <span class="sun__disc"></span>
        </div>

        <!-- NUBES: cruzan despacio; su color cambia con la luz del día. -->
        <div class="clouds">
          <svg class="cloud" style="--top:24%; --w:30%; --dur:150s; --delay:-40s" viewBox="0 0 120 46"><path class="cloud__body" d="M14 44C5 44 1 37 5 31C2 23 10 16 19 19C21 9 34 4 44 10C50 2 66 1 73 10C80 5 93 7 96 17C106 15 116 23 113 33C118 38 113 44 106 44Z"/><path class="cloud__shade" d="M6 36C24 41 82 42 114 35C114 41 110 44 106 44L14 44C9 44 6 41 6 36Z"/></svg>
          <svg class="cloud" style="--top:38%; --w:19%; --dur:115s; --delay:-85s" viewBox="0 0 120 46"><path class="cloud__body" d="M14 44C5 44 1 37 5 31C2 23 10 16 19 19C21 9 34 4 44 10C50 2 66 1 73 10C80 5 93 7 96 17C106 15 116 23 113 33C118 38 113 44 106 44Z"/><path class="cloud__shade" d="M6 36C24 41 82 42 114 35C114 41 110 44 106 44L14 44C9 44 6 41 6 36Z"/></svg>
          <svg class="cloud" style="--top:30%; --w:24%; --dur:185s; --delay:-150s" viewBox="0 0 120 46"><path class="cloud__body" d="M14 44C5 44 1 37 5 31C2 23 10 16 19 19C21 9 34 4 44 10C50 2 66 1 73 10C80 5 93 7 96 17C106 15 116 23 113 33C118 38 113 44 106 44Z"/><path class="cloud__shade" d="M6 36C24 41 82 42 114 35C114 41 110 44 106 44L14 44C9 44 6 41 6 36Z"/></svg>
        </div>

        <!-- PAISAJE LEJANO · Roma: colinas, ciudad lejana y la cúpula de
             San Pedro. viewBox 600×480 con el horizonte en y=300; en
             pantallas angostas se recortan los lados (slice) y en las
             anchas se ve el paisaje completo. -->
        <svg class="scene" viewBox="0 0 600 480" preserveAspectRatio="xMidYMax slice">
          <!-- Colinas -->
          <path class="c-far" d="M0 298C40 290 86 285 132 289C176 293 214 300 262 297C306 294 346 287 392 287C438 287 470 293 512 295C548 296 578 291 600 290V480H0Z"/>
          <!-- Ciudad lejana sobre las colinas -->
          <path class="c-far2" d="M328 300V294H338V291H346V293H356V289H364V292H376V290H386V293H398V291H404V300ZM456 300V291H466V293H474V289H484V292H494V290H504V294H516V292H526V300Z"/>
          <!-- Basílica y cúpula de San Pedro (tambor, cúpula, linterna y cruz).
               De noche la cúpula toma un tono cálido, como iluminada. -->
          <g class="c-dome">
            <rect x="404" y="286" width="52" height="10"/>
            <rect x="418" y="276" width="24" height="12"/>
            <path d="M415 277.5C415 259 445 259 445 277.5Z"/>
            <rect x="427.6" y="256" width="4.8" height="8.5"/>
            <path d="M426.6 256.6L430 251.6L433.4 256.6Z"/>
            <rect x="429.4" y="245.5" width="1.2" height="6.5"/>
            <rect x="427.8" y="247.2" width="4.4" height="1.1"/>
          </g>
          <!-- Ventanitas lejanas: cada una se enciende a su ritmo al
               anochecer según su umbral --th (0 = primero, 1 = último). -->
          <g class="win win--far">
            <rect x="340" y="295" width="1.4" height="1.4" style="--th:.1"/>
            <rect x="350" y="295.6" width="1.4" height="1.4" style="--th:.55"/>
            <rect x="359" y="292" width="1.4" height="1.4" style="--th:.3"/>
            <rect x="370" y="294" width="1.4" height="1.4" style="--th:.7"/>
            <rect x="380" y="292.6" width="1.4" height="1.4" style="--th:.2"/>
            <rect x="391" y="295" width="1.4" height="1.4" style="--th:.45"/>
            <rect x="461" y="294" width="1.4" height="1.4" style="--th:.35"/>
            <rect x="470" y="295.4" width="1.4" height="1.4" style="--th:.8"/>
            <rect x="478" y="292.4" width="1.4" height="1.4" style="--th:.15"/>
            <rect x="488" y="294" width="1.4" height="1.4" style="--th:.6"/>
            <rect x="498" y="293" width="1.4" height="1.4" style="--th:.25"/>
            <rect x="510" y="295.6" width="1.4" height="1.4" style="--th:.5"/>
          </g>
          <!-- Arboleda (capa media, detrás del Coliseo) -->
          <path class="c-mid" d="M0 354V330C6 322 16 320 22 326C28 318 40 318 44 326C52 320 62 322 64 330C72 324 82 326 84 332C92 326 102 328 104 334C112 328 124 330 126 336C136 332 146 334 150 340L200 344L400 344C410 336 420 334 428 338C434 330 446 330 450 336C458 330 470 332 472 338C480 332 492 332 496 338C504 330 516 330 520 336C528 328 540 328 544 334C552 326 566 326 570 332C578 326 592 328 600 334V354Z"/>
        </svg>

        <!-- PAISAJE CERCANO · Roma: Coliseo, pinos piñoneros, cipreses,
             suelo y faroles. Mismo viewBox que la capa lejana para que
             todo quede alineado. -->
        <svg class="scene" viewBox="0 0 600 480" preserveAspectRatio="xMidYMax slice">
          <defs>
            <radialGradient id="lamp-glow-it">
              <stop offset="0" stop-color="#ffd890" stop-opacity=".85"/>
              <stop offset="1" stop-color="#ffd890" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Coliseo: el lado izquierdo conserva sus 4 niveles y el derecho
               muestra la parte derrumbada (anillo interior más bajo). Los
               arcos se angostan hacia los extremos por la curvatura. -->
          <g class="colosseum">
            <path class="c-land" d="M205 353V284Q205 277 213 276L318 274L321 279L326 278L330 285L335 284L339 291L344 290L348 297L353 296L356 302L388 304Q395 306 395 314V353Z"/>
            <g class="c-land2">
              <rect x="205" y="295.5" width="140" height="2.2"/>
              <rect x="205" y="313.4" width="190" height="2"/>
              <rect x="205" y="331.6" width="190" height="2"/>
              <rect x="203" y="350" width="194" height="3"/>
            </g>
            <!-- Arcos (3 niveles) y ventanas del ático: de día son sombra,
                 de noche se encienden con luz dorada. -->
            <path class="arch" d="M214.9 350V338.4a2.4 2.4 0 0 1 4.8 0V350zM220.6 350V339.1a3.2 3.2 0 0 1 6.3 0V350zM228.8 350V339.8a3.8 3.8 0 0 1 7.6 0V350zM239 350V340.4a4.4 4.4 0 0 1 8.8 0V350zM251.1 350V340.9a4.9 4.9 0 0 1 9.7 0V350zM264.7 350V341.2a5.2 5.2 0 0 1 10.4 0V350zM279.3 350V341.4a5.4 5.4 0 0 1 10.9 0V350zM294.5 350V341.5a5.5 5.5 0 0 1 11 0V350zM309.9 350V341.4a5.4 5.4 0 0 1 10.9 0V350zM324.9 350V341.2a5.2 5.2 0 0 1 10.4 0V350zM339.1 350V340.9a4.9 4.9 0 0 1 9.7 0V350zM352.2 350V340.4a4.4 4.4 0 0 1 8.8 0V350zM363.6 350V339.8a3.8 3.8 0 0 1 7.6 0V350zM373.1 350V339.1a3.2 3.2 0 0 1 6.3 0V350zM380.3 350V338.4a2.4 2.4 0 0 1 4.8 0V350zM214.9 331V319.4a2.4 2.4 0 0 1 4.8 0V331zM220.6 331V320.1a3.2 3.2 0 0 1 6.3 0V331zM228.8 331V320.8a3.8 3.8 0 0 1 7.6 0V331zM239 331V321.4a4.4 4.4 0 0 1 8.8 0V331zM251.1 331V321.9a4.9 4.9 0 0 1 9.7 0V331zM264.7 331V322.2a5.2 5.2 0 0 1 10.4 0V331zM279.3 331V322.4a5.4 5.4 0 0 1 10.9 0V331zM294.5 331V322.5a5.5 5.5 0 0 1 11 0V331zM309.9 331V322.4a5.4 5.4 0 0 1 10.9 0V331zM324.9 331V322.2a5.2 5.2 0 0 1 10.4 0V331zM339.1 331V321.9a4.9 4.9 0 0 1 9.7 0V331zM352.2 331V321.4a4.4 4.4 0 0 1 8.8 0V331zM363.6 331V320.8a3.8 3.8 0 0 1 7.6 0V331zM373.1 331V320.1a3.2 3.2 0 0 1 6.3 0V331zM380.3 331V319.4a2.4 2.4 0 0 1 4.8 0V331zM214.9 312V301.4a2.4 2.4 0 0 1 4.8 0V312zM220.6 312V302.1a3.2 3.2 0 0 1 6.3 0V312zM228.8 312V302.8a3.8 3.8 0 0 1 7.6 0V312zM239 312V303.4a4.4 4.4 0 0 1 8.8 0V312zM251.1 312V303.9a4.9 4.9 0 0 1 9.7 0V312zM264.7 312V304.2a5.2 5.2 0 0 1 10.4 0V312zM279.3 312V304.4a5.4 5.4 0 0 1 10.9 0V312zM294.5 312V304.5a5.5 5.5 0 0 1 11 0V312zM309.9 312V304.4a5.4 5.4 0 0 1 10.9 0V312zM324.9 312V304.2a5.2 5.2 0 0 1 10.4 0V312zM216.2 282h2.2v7h-2.2zM222.5 282h2.6v7h-2.6zM231 282h3.2v7h-3.2zM241.6 282h3.7v7h-3.7zM254 282h4.1v7h-4.1zM267.7 282h4.4v7h-4.4zM282.4 282h4.6v7h-4.6zM297.7 282h4.6v7h-4.6z"/>
          </g>

          <!-- Pinos piñoneros (el árbol típico de Roma) y cipreses -->
          <g class="c-tree">
            <!-- Pino grande (izquierda): tronco, ramas y copa en sombrilla -->
            <path d="M168 353C167 330 160 300 156 262L161 262C165 296 172 326 175 353Z"/>
            <path d="M158 277C150 271 140 267 130 262L132 260C142 264 152 268 160 272Z"/>
            <path d="M160 268C168 264 178 262 187 259L187 261.5C179 264 170 266 161 271Z"/>
            <path d="M104 258C98 252 104 244 114 245C116 238 128 234 137 238C142 231 156 230 163 235C170 229 186 230 190 237C198 234 210 238 209 245C217 248 216 257 207 259C196 263 182 260 172 262C162 264 150 261 140 263C128 265 112 264 104 258Z"/>
            <!-- Pino pequeño (extremo izquierdo, se ve en pantallas anchas) -->
            <path d="M62 353C61 330 58 300 56 276L60 276C63 300 66 330 67 353Z"/>
            <path d="M24 274C20 268 26 262 34 263C37 257 48 255 54 259C60 253 74 254 78 260C86 259 94 264 91 270C93 276 84 278 76 277C66 279 52 277 42 278C32 279 26 278 24 274Z"/>
            <!-- Cipreses (derecha) -->
            <path d="M478 292C475 304 473 328 475 353L482 353C484 328 481 304 478 292Z"/>
            <path d="M494 268C489 286 486 318 489 353L499 353C502 318 499 286 494 268Z"/>
            <path d="M508 282C504 298 502 324 504 353L512 353C514 324 512 298 508 282Z"/>
            <!-- Pino pequeño (extremo derecho) -->
            <path d="M552 353C553 330 556 304 557 280L561 280C560 304 558 330 557 353Z"/>
            <path d="M522 278C518 272 524 266 532 267C535 261 546 259 552 263C558 257 572 258 576 264C584 263 592 268 589 274C591 280 582 282 574 281C564 283 550 281 540 282C530 283 524 282 522 278Z"/>
          </g>

          <!-- Suelo (primer plano) -->
          <path class="c-near" d="M0 353C120 349 220 355 320 352C420 349 520 355 600 351V480H0Z"/>

          <!-- Faroles: poste + luz + resplandor (se encienden al anochecer) -->
          <g class="lamps">
            <g><rect class="lamp__post" x="127.4" y="340" width="1.2" height="14"/><circle class="lamp__glow" cx="128" cy="339.5" r="8" fill="url(#lamp-glow-it)"/><circle class="lamp__bulb" cx="128" cy="339.5" r="1.7"/></g>
            <g><rect class="lamp__post" x="187.4" y="340" width="1.2" height="14"/><circle class="lamp__glow" cx="188" cy="339.5" r="8" fill="url(#lamp-glow-it)"/><circle class="lamp__bulb" cx="188" cy="339.5" r="1.7"/></g>
            <g><rect class="lamp__post" x="413.4" y="340" width="1.2" height="14"/><circle class="lamp__glow" cx="414" cy="339.5" r="8" fill="url(#lamp-glow-it)"/><circle class="lamp__bulb" cx="414" cy="339.5" r="1.7"/></g>
            <g><rect class="lamp__post" x="451.4" y="340" width="1.2" height="14"/><circle class="lamp__glow" cx="452" cy="339.5" r="8" fill="url(#lamp-glow-it)"/><circle class="lamp__bulb" cx="452" cy="339.5" r="1.7"/></g>
            <g><rect class="lamp__post" x="531.4" y="340" width="1.2" height="14"/><circle class="lamp__glow" cx="532" cy="339.5" r="8" fill="url(#lamp-glow-it)"/><circle class="lamp__bulb" cx="532" cy="339.5" r="1.7"/></g>
          </g>
        </svg>

        <span class="sky__veil"></span>
      </div>

      <!-- ENCABEZADO: bandera ondeando + país + ciudad.
           Las franjas que hacen ondear la bandera las crea script.js; si no
           hay JS, la bandera se ve quieta (fondo de .flag__cloth). -->
      <header class="place__head">
        <span class="flag flag--it" aria-hidden="true"><span class="flag__cloth" data-role="flag"></span></span>
        <div class="place__names">
          <h2 class="place__country" id="it-name">Italia</h2>
          <p class="place__city">Roma</p>
        </div>
      </header>

      <!-- RELOJ: horas:minutos grandes; segundos y a. m./p. m. al lado.
           Cada "slot" es un dígito que rueda hacia arriba al cambiar.
           El reloj visual se oculta a lectores de pantalla; para ellos
           está el texto #it-sr (se actualiza cada minuto). -->
      <div class="place__time">
        <p class="clock" aria-hidden="true">
          <span class="clock__main">
            <span class="slot" data-d="h1"></span><span class="slot" data-d="h2"></span><span class="clock__colon">:</span><span class="slot" data-d="m1"></span><span class="slot" data-d="m2"></span>
          </span>
          <span class="clock__side">
            <span class="clock__sec"><span class="slot" data-d="s1"></span><span class="slot" data-d="s2"></span></span>
            <span class="clock__period" data-role="period"></span>
          </span>
        </p>
        <p class="place__date"><span data-role="date"></span><span class="place__shift" data-role="shift" hidden>+1 día</span></p>
        <p class="sr-only" id="it-sr" data-role="sr"></p>
      </div>
    </article>

    <!-- ┌──────────────────────────────────────────────────────────────┐
         │ PUENTE CENTRAL · diferencia horaria                          │
         │ script.js calcula la diferencia en vivo: hoy son 7 horas     │
         │ (Italia en horario de verano) y pasa sola a 6 horas cuando   │
         │ Italia cambia la hora (último domingo de octubre).           │
         └──────────────────────────────────────────────────────────────┘ -->
    <div class="bridge" data-role="bridge">
      <span class="bridge__wire" aria-hidden="true"></span>
      <p class="bridge__badge">
        <span class="bridge__num" data-role="diff-num">7</span>
        <span class="bridge__unit" data-role="diff-unit">horas</span>
      </p>
      <p class="bridge__note" data-role="diff-note">Italia va adelante</p>
    </div>

    <!-- ┌──────────────────────────────────────────────────────────────┐
         │ TARJETA · COLOMBIA (Cartagena)                               │
         │ Zona America/Bogota (UTC−5 todo el año, sin horario de       │
         │ verano) y coordenadas de la Torre del Reloj.                 │
         └──────────────────────────────────────────────────────────────┘ -->
    <article class="place place--co" data-place="colombia" tabindex="0" aria-labelledby="co-name" aria-describedby="co-sr">

      <div class="sky" aria-hidden="true">
        <canvas class="sky__stars" data-role="stars"></canvas>

        <div class="moon" data-role="moon">
          <span class="moon__halo"></span>
          <svg class="moon__svg" viewBox="0 0 100 100">
            <defs>
              <radialGradient id="moon-lit-co" cx="42%" cy="38%" r="70%">
                <stop offset="0" stop-color="#fffdf4"/>
                <stop offset=".65" stop-color="#ebe7da"/>
                <stop offset="1" stop-color="#c9c4b4"/>
              </radialGradient>
              <clipPath id="moon-clip-co"><path data-role="moon-phase" d="M50 2a48 48 0 1 1 0 96a48 48 0 1 1 0-96z"/></clipPath>
            </defs>
            <circle class="moon__dark" cx="50" cy="50" r="48"/>
            <g clip-path="url(#moon-clip-co)">
              <circle cx="50" cy="50" r="48" fill="url(#moon-lit-co)"/>
              <g class="moon__maria">
                <ellipse cx="35" cy="33" rx="13" ry="10"/>
                <ellipse cx="57" cy="32" rx="8" ry="7"/>
                <ellipse cx="63" cy="47" rx="9" ry="7"/>
                <ellipse cx="74" cy="58" rx="5" ry="7"/>
